name: quakescope

services:
  # 1. The API: serves earthquake data and publishes /metrics
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      CACHE_SECONDS: ${CACHE_SECONDS:-60}      # how long a USGS answer is reused
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 2. Prometheus: collects /metrics from the API every 5 seconds
  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 3. Grafana: draws the dashboard. Data source and dashboard load from files.
  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # anyone can view without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/quakescope.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # 4. Load generator: sends normal traffic so the graphs are never empty
  loadgen:
    build: ./loadgen
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 5. The website (nginx): overview and live graphs
  site:
    build: ./site
    ports:
      - "8081:80"
    depends_on:
      - api
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
