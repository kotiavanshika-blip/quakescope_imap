server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The web pages ask for /api/... and /prom/...; nginx forwards those requests.
  location /api/ {
    proxy_pass http://api:8000/;
  }
  location /prom/ {
    proxy_pass http://prometheus:9090/;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
